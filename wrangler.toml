# Cloudflare Workers configuration for Koumian Academy.
# Uses @opennextjs/cloudflare adapter — produces a Worker + Static Assets bundle.
#
# Docs: https://opennext.js.org/cloudflare

name = "koumian-academy"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"

# Required to polyfill Node.js APIs (bcryptjs, etc.) and to run our auth
# stack on the Cloudflare runtime.
compatibility_flags = ["nodejs_compat"]

# Static assets served from the edge CDN; everything else routes to the Worker.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
